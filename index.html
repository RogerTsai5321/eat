<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今天吃什麼</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#1D1D1F;--red:#FF4B2B;--blue:#1B2CC1;--mute:#86868B;--fill:#F2F2F7;--hair:#E5E5EA;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang TC","Helvetica Neue","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding-bottom:50px}
.sec{padding:4px 18px 20px}
.hero{background:var(--red);color:#fff;padding:28px 18px 24px;border-radius:0 0 32px 32px}
.hero small{font-weight:600;letter-spacing:.04em;opacity:.92}
h1{font:800 clamp(56px,17vw,104px)/1 var(--font);letter-spacing:-.03em;margin:8px 0 12px}
h2{font:700 22px/1.3 var(--font);letter-spacing:-.01em;margin:32px 0 12px}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input,textarea{font:inherit;color:inherit}
input[type=text],input[type=number],textarea{width:100%;padding:12px 16px;border:0;border-radius:14px;background:var(--fill);outline:0;transition:box-shadow .15s}
input[type=number]{width:84px;text-align:center}
input[type=text]:focus,input[type=number]:focus,textarea:focus{box-shadow:0 0 0 3px rgba(27,44,193,.25)}
.hero input[type=text]{background:rgba(255,255,255,.95)}
textarea{min-height:100px;resize:vertical}
.chip{border:0;background:#E5E5EA;color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;transition:transform .1s,background .15s}
.chip.on{background:var(--ink);color:#fff}
.chip.no{background:#FFE3DD;color:#D8321A;text-decoration:line-through}
.btn{border:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;transition:transform .1s}
.chip:active,.btn:active{transform:scale(.95)}
.hero .btn,.card .btn{background:#FFD60A;color:#1D1D1F}
.btn:focus-visible,.chip:focus-visible,.go:focus-visible{outline:3px solid rgba(27,44,193,.45);outline-offset:2px}
.go{display:block;width:100%;background:var(--ink);color:#fff;border:0;font:800 clamp(26px,8vw,44px)/1.2 var(--font);padding:22px;border-radius:28px;cursor:pointer;margin:24px 0;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .1s}
.go:active{transform:scale(.98)}
.card{background:var(--blue);color:#fff;padding:24px 22px;border-radius:28px;margin-bottom:8px;box-shadow:0 12px 32px rgba(27,44,193,.3)}
.card b{display:block;font:800 clamp(32px,9.5vw,56px)/1.15 var(--font);letter-spacing:-.02em;margin-bottom:8px;word-break:break-word}
.card a{color:#fff;background:rgba(255,255,255,.18);padding:4px 14px;border-radius:999px;font-weight:600;margin:0 8px 6px 0;text-decoration:none;display:inline-block}
.card .mute{color:#dfe3ff}
.tag{display:inline-block;padding:0 9px;border-radius:999px;background:var(--fill);color:var(--ink);font-size:12px;font-weight:600;margin-left:4px}
.card .tag{background:rgba(255,255,255,.2);color:#fff}
.tag.open{background:#D6F5E3;color:#0A7A3C}.tag.closed{background:var(--hair);color:#6B6B70}
.card .tag.open{background:#18B25B;color:#fff}.card .tag.closed{background:rgba(0,0,0,.3);color:#fff}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.item small{color:var(--mute)}
.ic{border:none;background:none;cursor:pointer;font-size:20px;padding:2px 6px}
.bar{display:grid;grid-template-columns:64px 1fr 28px;gap:8px;align-items:center;margin:8px 0}
.bar i{display:block;height:14px;background:var(--red);border-radius:999px}.bar b{text-align:right}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.opts label{display:flex;align-items:center;gap:10px;background:var(--fill);padding:10px 14px;border-radius:14px}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:999px;background:#D1D1D6;position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
input[type=checkbox]:checked{background:#34C759}
input[type=checkbox]:checked::after{transform:translateX(18px)}
label{cursor:pointer}
a{color:var(--blue)}
#map{height:380px;margin:16px;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.15);position:relative;z-index:0}
.leaflet-container{font-family:var(--font)}
.name{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<header class="hero"><small id="meal"></small>
<h1>今天<br>吃什麼</h1>
<p id="status">請按「用我的位置搜尋」，或直接在地圖上點一下選擇出發點。</p>

<div class="row">
  <button class="btn" id="locBtn">用我的位置搜尋</button>
</div>
<div class="row" style="margin-top:8px">
  <input type="text" id="addr" placeholder="或輸入地址／地標，例如：桃園火車站" style="flex:1;min-width:200px">
  <button class="btn" id="addrBtn">搜尋</button>
</div>
</header>
<div id="map"></div>
<div class="sec">
<p class="mute">藍色圓點是出發點，紅色圓點是設定時間內可開車到達的餐廳，黃色是抽中的店。定位不準時，點地圖就能修正出發點。</p>

<div class="row" style="margin-top:14px">
  <label for="mins">開車時間上限</label>
  <input type="number" id="mins" min="1" max="30" step="1" value="10">
  <span>分鐘內</span>
  <span class="mute">（1–30，修改後自動重新搜尋）</span>
</div>

<h2>類型</h2>
<p class="mute">點一下＝想吃，再點一下＝今天不想吃，第三下取消。</p>
<div class="row" id="chips"></div>
<div class="opts">
  <label><input type="checkbox" id="avoid" checked> 避開最近吃過的</label>
  <label><input type="checkbox" id="favOnly"> 只看收藏</label>
  <label><input type="checkbox" id="openOnly"> 只看營業中</label>
  <label><input type="checkbox" id="noChain"> 排除連鎖店</label>
  <label><input type="checkbox" id="byMeal" checked> 依時段推薦</label>
</div>

<button class="go" id="pickBtn">幫我決定！</button>
<div id="pick"></div>

<h2>備註</h2>
<textarea id="notes" placeholder="想到什麼都可以寫在這裡"></textarea>

<h2>符合條件的餐廳 <span class="mute" id="count"></span></h2>
<div id="list"></div>

<h2>我的收藏</h2>
<div id="favs"></div>

<h2>本月吃過什麼</h2>
<div id="stats"></div>

<h2>最近吃過 <button class="btn" id="clrHist" style="margin-left:8px">清除</button></h2>
<div id="hist"></div>

<h2>黑名單</h2>
<div id="bans"></div>

</div>
<p class="mute sec">地圖資料：OpenStreetMap；路程估算：OSRM。部分店家沒有填寫菜系，只會在「全部」中出現。</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const CATS = [
  ['中式', /chinese|taiwanese|noodle|dumpling|congee/],
  ['西式', /american|burger|steak|western|french|german|spanish|sandwich|bbq|barbecue/],
  ['日式', /japanese|sushi|ramen|udon|tempura|yakiniku|izakaya/],
  ['義式', /italian|pizza|pasta/],
  ['韓式', /korean/],
  ['火鍋', /hot_?pot/],
  ['早餐', /breakfast|brunch/],
  ['小吃', /snack|street_food|chicken|bubble_tea|fried/],
  ['素食', /vegetarian|vegan/]
];
let S = { fav: {}, ban: {}, hist: [], notes: '' };
try { Object.assign(S, JSON.parse(localStorage.getItem('lunch-v1') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('lunch-v1', JSON.stringify(S)); } catch (e) {} };
let loc = null, places = [], sel = new Set(), exc = new Set();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const status = t => $('#status').textContent = t;

// 類型按鈕
CATS.forEach(([k]) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = k;
  b.onclick = () => {
    if (sel.has(k)) { sel.delete(k); exc.add(k); b.className = 'chip no'; }
    else if (exc.has(k)) { exc.delete(k); b.className = 'chip'; }
    else { sel.add(k); b.className = 'chip on'; }
    render();
  };
  $('#chips').appendChild(b);
});

// 地圖
const map = L.map('map').setView([24.9936, 121.3010], 12);
const bases = {
  '街道': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles © Esri, HERE, Garmin, OpenStreetMap contributors' }),
  '地形': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { subdomains: 'abc', maxZoom: 17, attribution: '© OpenStreetMap contributors, SRTM | © OpenTopoMap' })
};
let baseErr = 0;
bases['街道'].addTo(map);
bases['街道'].on('tileerror', () => {
  if (++baseErr === 6) { map.removeLayer(bases['街道']); bases['地形'].addTo(map); status('街道底圖載入失敗，已自動切換為地形底圖。'); }
});
L.control.layers(bases, null, { position: 'topright' }).addTo(map);
const layer = L.layerGroup().addTo(map);
let me = null, markers = {}, picked = null;
map.on('click', e => setStart(e.latlng.lat, e.latlng.lng));
function setStart(lat, lon, msg) {
  loc = { lat, lon };
  if (me) me.setLatLng([lat, lon]);
  else me = L.circleMarker([lat, lon], { radius: 9, color: '#fff', weight: 3, fillColor: '#1E5BFF', fillOpacity: 1 }).addTo(map).bindPopup('出發點');
  map.setView([lat, lon], 14);
  search(msg);
}
function focusP(id) {
  const p = find(id); if (!p) return;
  picked = id; render();
  map.setView([p.lat, p.lon], Math.max(map.getZoom(), 16));
  if (markers[id]) markers[id].openPopup();
}

// 定位
$('#locBtn').onclick = () => {
  status('定位中…');
  const fallback = async why => {
    try {
      const r = await (await fetch('https://ipwho.is/')).json();
      if (!r.success) throw 0;
      setStart(r.latitude, r.longitude, why + '已改用網路位置概估（可能差幾公里），請在地圖上點一下修正出發點。');
    } catch (e) { status(why + '請直接在地圖上點一下選擇出發點，或輸入地址。'); }
  };
  if (!navigator.geolocation) return fallback('此瀏覽器不支援定位。');
  navigator.geolocation.getCurrentPosition(
    p => setStart(p.coords.latitude, p.coords.longitude),
    err => fallback(err.code === 1 ? '瀏覽器或系統拒絕了定位權限（本機檔案常被擋）。' : '無法取得定位。'),
    { timeout: 10000, enableHighAccuracy: false, maximumAge: 60000 }
  );
};
$('#addrBtn').onclick = async () => {
  const q = $('#addr').value.trim();
  if (!q) return;
  status('查詢地址…');
  try {
    const r = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))).json();
    if (!r[0]) return status('找不到這個地點，換個說法試試');
    setStart(+r[0].lat, +r[0].lon);
  } catch (e) { status('地址查詢失敗，請稍後再試'); }
};

// 搜尋：Overpass 找店 → OSRM 算開車時間 → 留下設定分鐘內
const getMins = () => { let m = Math.round(+$('#mins').value); if (!(m >= 1)) m = 10; return Math.min(30, m); };
async function getJSON(url, opt, ms = 30000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { ...opt, signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.openstreetmap.fr/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
];
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 同時問多個伺服器，誰先成功就用誰；全部失敗時等幾秒再重試一輪
async function overpass(q) {
  let last;
  for (let round = 0; round < 3; round++) {
    try {
      status(round ? `伺服器忙碌，第 ${round + 1} 次嘗試中…` : '搜尋附近餐廳…');
      return await Promise.any(OVERPASS.map(u =>
        getJSON(u + '?data=' + encodeURIComponent(q), {}, 25000).then(d => {
          if (!d.elements || (d.remark && !d.elements.length)) throw new Error('伺服器逾時');
          return d;
        })));
    } catch (e) { last = e; await sleep(3000); }
  }
  throw last;
}

async function search(note) {
  const M = getMins(), R = Math.min(20000, M * 700);
  const pre = note ? note + ' ' : '';
  status(pre + '搜尋附近餐廳…');
  let d;
  const key = 'ov2:' + R + ':' + loc.lat.toFixed(3) + ',' + loc.lon.toFixed(3);
  try { const c0 = JSON.parse(localStorage.getItem(key) || 'null'); if (c0 && Date.now() - c0.t < 12 * 36e5) d = { elements: c0.e }; } catch (e) {}
  if (!d) {
    try {
      const q = `[out:json][timeout:20];nwr["amenity"~"^(restaurant|fast_food|food_court)$"](around:${R},${loc.lat},${loc.lon});out center tags;`;
      d = await overpass(q);
      try {
        const e = d.elements.map(x => ({ type: x.type, id: x.id, lat: x.lat, lon: x.lon, center: x.center,
          tags: Object.fromEntries(['name','name:zh','cuisine','diet:vegetarian','opening_hours','phone','contact:phone','website','contact:website','brand','brand:wikidata'].filter(k => (x.tags || {})[k]).map(k => [k, x.tags[k]])) }));
        localStorage.setItem(key, JSON.stringify({ t: Date.now(), e }));
      } catch (e) {}
    } catch (e) {
      return status(pre + '找餐廳失敗：5 個地圖資料伺服器都沒有回應，可能是伺服器忙碌，或你的網路／瀏覽器擋住了連線。請稍等 1 分鐘再點一次地圖，或換個瀏覽器試試。');
    }
  }

  const kx = Math.cos(loc.lat * Math.PI / 180);
  let c = (d.elements || []).map(e => {
    const t = e.tags || {};
    const la = e.lat ?? (e.center && e.center.lat), lo = e.lon ?? (e.center && e.center.lon);
    return { id: e.type + e.id, name: t['name:zh'] || t.name, lat: la, lon: lo,
             oh: t.opening_hours, phone: t.phone || t['contact:phone'], web: t.website || t['contact:website'], chain: !!(t.brand || t['brand:wikidata']),
             cuisine: (t.cuisine || '') + ' ' + (t['diet:vegetarian'] === 'only' ? 'vegetarian' : '') };
  }).filter(x => x.name && x.lat);
  c.forEach(x => x.dist = (x.lat - loc.lat) ** 2 + ((x.lon - loc.lon) * kx) ** 2);
  c.sort((a, b) => a.dist - b.dist);
  c = c.slice(0, M > 15 ? 495 : 297);

  status(pre + `找到 ${c.length} 家，計算開車時間…`);
  places = [];
  let est = false;
  for (let i = 0; i < c.length; i += 99) {
    const ch = c.slice(i, i + 99);
    let dur = null;
    try {
      const co = [loc, ...ch].map(p => p.lon.toFixed(5) + ',' + p.lat.toFixed(5)).join(';');
      const r = await getJSON(`https://router.project-osrm.org/table/v1/driving/${co}?sources=0&annotations=duration`, {}, 20000);
      if (r.durations && r.durations[0]) dur = r.durations[0].slice(1);
    } catch (e) {}
    if (!dur) { // 路徑服務失敗：用直線距離 ×1.4，時速 30 公里概估
      est = true;
      dur = ch.map(p => Math.sqrt(p.dist) * 111000 * 1.4 / (30000 / 3600));
    }
    ch.forEach((p, j) => {
      const s = dur[j];
      if (s != null && s <= M * 60) {
        p.min = Math.max(1, Math.round(s / 60));
        p.cats = CATS.filter(k => k[1].test(p.cuisine)).map(k => k[0]);
        places.push(p);
      }
    });
  }
  places.sort((a, b) => a.min - b.min);
  picked = null;
  status(pre + `找到 ${places.length} 家開車 ${M} 分鐘內的餐廳` + (est ? '（路徑服務忙碌，車程為概估值）' : ''));
  render();
  if (places.length) map.fitBounds(L.latLngBounds([[loc.lat, loc.lon], ...places.map(p => [p.lat, p.lon])]).pad(0.1));
}

// 時段：早餐／午餐／下午茶／晚餐／宵夜
function meal() {
  const h = new Date().getHours(), N = ['小吃', '日式', '火鍋'];
  return h < 5 ? ['宵夜', N] : h < 10 ? ['早餐', ['早餐', '小吃']] : h < 14 ? ['午餐', null] : h < 17 ? ['下午茶', ['小吃', '早餐']] : h < 21 ? ['晚餐', null] : ['宵夜', N];
}
const mealCats = () => $('#byMeal').checked && !sel.size ? meal()[1] : null;

// 營業時間判斷（支援常見的 OSM opening_hours 格式；看不懂就回傳 null＝不明）
const DAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
function openNow(oh) {
  if (!oh) return null;
  if (/24\/7/.test(oh)) return true;
  const now = new Date(), d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  let res = null, sawDays = false;
  for (const rule of oh.split(';')) {
    const r = rule.trim(); if (!r) continue;
    if (/PH|SH|week|\[|sunrise|sunset|"/.test(r)) continue;
    const mt = r.match(/^([A-Za-z,\- ]*?)\s*((?:\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}[, ]*)+|off|closed)$/i);
    if (!mt) return null;
    const dp = mt[1].trim(); let hit = !dp;
    if (dp) {
      sawDays = true;
      for (const seg of dp.split(',')) {
        const [x, y] = seg.trim().split('-'), i = DAYS.indexOf(x.trim()), j = y ? DAYS.indexOf(y.trim()) : i;
        if (i < 0 || j < 0) return null;
        for (let k = i; ; k = (k + 1) % 7) { if (k === d) hit = true; if (k === j) break; }
      }
    }
    if (!hit) continue;
    if (/off|closed/i.test(mt[2])) { res = false; continue; }
    res = false;
    for (const t of mt[2].split(',')) {
      const q = t.match(/(\d+):(\d+)\s*-\s*(\d+):(\d+)/); if (!q) continue;
      const a = +q[1] * 60 + +q[2], b = +q[3] * 60 + +q[4];
      if (b > a ? (m >= a && m < b) : (m >= a || m < b)) res = true;
    }
  }
  return res === null && sawDays ? false : res;
}
const openTag = x => { const o = openNow(x.oh); return o === true ? '<span class="tag open">營業中</span>' : o === false ? '<span class="tag closed">已打烊</span>' : '<span class="tag">營業時間不明</span>'; };

// 篩選條件
function ok(p) {
  return !S.ban[p.id] && (!sel.size || p.cats.some(c => sel.has(c))) && !p.cats.some(c => exc.has(c)) &&
    (!$('#favOnly').checked || S.fav[p.id]) && !($('#noChain').checked && p.chain) &&
    !($('#openOnly').checked && openNow(p.oh) === false);
}
function pool(skipMeal) {
  const now = Date.now(), mc = skipMeal ? null : mealCats();
  const recent = new Set(S.hist.filter(h => now - h.t < 7 * 864e5).map(h => h.id));
  const last = S.hist[0], lastCats = last && now - last.t < 864e5 ? last.cats : [];
  return places.filter(p => ok(p) && (!mc || p.cats.some(c => mc.includes(c))) &&
    (!$('#avoid').checked || (!recent.has(p.id) && !(lastCats.length && p.cats.some(c => lastCats.includes(c))))));
}

// 隨機抽一家（老虎機動畫）
let spinning = false;
$('#pickBtn').onclick = () => {
  if (spinning) return;
  if (!places.length) { $('#pick').innerHTML = '<p class="mute">請先搜尋附近餐廳。</p>'; return; }
  let p = pool(); if (!p.length) p = pool(true);
  if (!p.length) { $('#pick').innerHTML = '<p class="mute">沒有符合條件的餐廳。放寬類型，或取消「避開最近吃過的」「只看營業中」再試試。</p>'; return; }
  const x = p[Math.floor(Math.random() * p.length)];
  spinning = true; let i = 0;
  const step = () => {
    if (i < 14) {
      $('#pick').innerHTML = `<div class="card"><b>${esc(p[Math.floor(Math.random() * p.length)].name)}</b></div>`;
      setTimeout(step, 50 + i * i * 1.6); i++;
    } else { spinning = false; showPick(x); }
  };
  step();
};
function showPick(x) {
  setTimeout(() => focusP(x.id), 0);
  const ph = /^[\d+\-\s()#,]+$/.test(x.phone || '') ? x.phone : '', web = /^https?:\/\//.test(x.web || '') ? x.web : '';
  $('#pick').innerHTML = `<div class="card"><b>${esc(x.name)}</b>
    <div class="mute">開車約 ${x.min} 分鐘 ${x.cats.length ? '・' + x.cats.join('、') : ''} ${openTag(x)}${x.chain ? '<span class="tag">連鎖</span>' : ''}</div>
    <p style="margin:10px 0">${ph ? `<a href="tel:${ph.replace(/\s/g, '')}">撥號 ${esc(ph)}</a>` : ''}${web ? `<a href="${esc(web)}" target="_blank" rel="noopener">官網／菜單</a>` : ''}<a href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}&travelmode=driving" target="_blank" rel="noopener">導航</a></p>
    <div class="row">
      <button class="btn" onclick="eat('${x.id}')">就吃這家</button>
      <button class="btn" onclick="fav('${x.id}')">${S.fav[x.id] ? '取消收藏' : '收藏'}</button>
      <button class="btn" onclick="ban('${x.id}')">不要再出現</button>
    </div></div>`;
}

const find = id => places.find(p => p.id === id);
function eat(id) {
  const p = find(id); if (!p) return;
  S.hist.unshift({ id, name: p.name, t: Date.now(), cats: p.cats });
  S.hist = S.hist.slice(0, 300); save();
  $('#pick').innerHTML = `<p class="mute">已記錄：${esc(p.name)}。用餐愉快！</p>`; render();
}
function fav(id) {
  const p = find(id); if (!p) return;
  S.fav[id] ? delete S.fav[id] : (S.fav[id] = p.name); save(); render();
  $('#pick').innerHTML = '';
}
function ban(id) {
  const p = find(id); if (!p) return;
  S.ban[id] = p.name; save(); render();
  $('#pick').innerHTML = `<p class="mute">已加入黑名單：${esc(p.name)}。</p>`;
}
function unfav(id) { delete S.fav[id]; save(); render(); }
function unban(id) { delete S.ban[id]; save(); render(); }

function render() {
  const all = places.filter(ok);
  layer.clearLayers(); markers = {};
  all.forEach(p => {
    const on = p.id === picked;
    markers[p.id] = L.circleMarker([p.lat, p.lon], on
      ? { radius: 13, color: '#17261F', weight: 3, fillColor: '#FFD60A', fillOpacity: 1 }
      : { radius: 7, color: '#fff', weight: 2, fillColor: '#FF4B2B', fillOpacity: .9 })
      .bindPopup(`<b>${esc(p.name)}</b><br>開車約 ${p.min} 分鐘`).addTo(layer);
    if (on) markers[p.id].bringToFront();
  });
  $('#count').textContent = places.length ? `（${all.length} 家，顯示前 30）` : '';
  $('#list').innerHTML = all.slice(0, 30).map(p => `<div class="item">
    <div><span class="name" onclick="focusP('${p.id}')">${S.fav[p.id] ? '★ ' : ''}${esc(p.name)}</span><br><small>約 ${p.min} 分鐘 ${p.cats.length ? '・' + p.cats.join('、') : ''}</small>${openTag(p)}</div>
    <div><button class="ic" title="收藏" onclick="fav('${p.id}')">${S.fav[p.id] ? '★' : '☆'}</button>
    <button class="ic" title="加入黑名單" onclick="ban('${p.id}')">🚫</button></div></div>`).join('')
    || `<p class="mute">${places.length ? '沒有符合條件的餐廳。若勾選了「只看收藏」，代表你的收藏店家不在目前範圍或類型內。' : '尚無資料。'}</p>`;
  const nw = new Date(), mh = S.hist.filter(h => { const d = new Date(h.t); return d.getFullYear() === nw.getFullYear() && d.getMonth() === nw.getMonth(); });
  const cnt = {}; mh.forEach(h => (h.cats && h.cats.length ? h.cats : ['未分類']).forEach(c => cnt[c] = (cnt[c] || 0) + 1));
  const top = Math.max(1, ...Object.values(cnt));
  $('#stats').innerHTML = mh.length ? `<p class="mute">本月共記錄 ${mh.length} 餐</p>` + Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="bar"><span>${k}</span><i style="width:${v / top * 100}%"></i><b>${v}</b></div>`).join('') : '<p class="mute">本月還沒有紀錄。按「就吃這家」就會累積統計。</p>';
  $('#hist').innerHTML = S.hist.slice(0, 10).map(h => {
    const d = new Date(h.t);
    return `<div class="item"><span>${esc(h.name)}</span><small>${d.getMonth() + 1}/${d.getDate()}</small></div>`;
  }).join('') || '<p class="mute">還沒有紀錄。</p>';
  const fk = Object.keys(S.fav);
  $('#favs').innerHTML = fk.map(id => `<div class="item"><div>★ ${esc(S.fav[id])}<br><small>${find(id) ? '在目前範圍內，約 ' + find(id).min + ' 分鐘' : '不在目前搜尋範圍'}</small></div>
    <button class="btn" onclick="unfav('${id}')">移除</button></div>`).join('') || '<p class="mute">還沒有收藏。</p>';
  const bk = Object.keys(S.ban);
  $('#bans').innerHTML = bk.map(id => `<div class="item"><span>${esc(S.ban[id])}</span>
    <button class="btn" onclick="unban('${id}')">移除</button></div>`).join('') || '<p class="mute">沒有黑名單店家。</p>';
}

['favOnly', 'openOnly', 'noChain', 'byMeal'].forEach(id => $('#' + id).onchange = render);
$('#mins').value = S.mins || 10;
$('#mins').onchange = () => {
  const m = getMins(); $('#mins').value = m; S.mins = m; save();
  if (loc) search();
};
$('#clrHist').onclick = () => { S.hist = []; save(); render(); };
{ const m = meal(); $('#meal').textContent = `現在是${m[0]}時間` + (m[1] ? '・優先推薦：' + m[1].join('、') : '・什麼都可以吃'); }
$('#notes').value = S.notes || '';
$('#notes').oninput = e => { S.notes = e.target.value; save(); };
render();
</script>
</body>
</html>
